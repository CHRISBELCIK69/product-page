<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Vertex Algo</title>
<link rel="stylesheet" href="/product-page.css">
<link rel="stylesheet" href="/checkout.css">
<script src="https://js.stripe.com/v3/"></script>
</head>
<body>

<nav>
  <div class="wrap">
    <a class="logo" href="/" style="text-decoration:none;">
      <svg class="logo-mark" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <polygon points="110,8 195,58 195,162 110,212 25,162 25,58" fill="none" stroke="var(--line)" stroke-width="10"/>
        <g stroke-linecap="round" stroke-linejoin="round" fill="none">
          <polyline points="60,150 110,70 160,150" stroke="var(--text-dim)" stroke-width="20"/>
          <line x1="82" y1="118" x2="138" y2="118" stroke="var(--text-dim)" stroke-width="20"/>
          <polyline points="60,70 110,150 160,70" stroke="var(--amber)" stroke-width="20"/>
        </g>
      </svg>
      VERTEX ALGO
    </a>
    <div class="nav-links">
      <a href="/">&larr; Back to site</a>
    </div>
  </div>
</nav>

<main class="checkout-wrap">
  <div class="checkout-card">

    <div class="checkout-order">
      <div>
        <div class="checkout-order-name">Backtester Subscription</div>
        <div class="checkout-order-sub">7-day free trial, then billed monthly</div>
      </div>
      <div class="checkout-order-price">$20<span>/mo</span></div>
    </div>

    <form id="checkout-form" novalidate>
      <label class="checkout-label" for="email">Email</label>
      <input class="checkout-input" type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>

      <label class="checkout-label" for="payment-element">Card information</label>
      <div id="payment-element"></div>

      <label class="checkout-label" for="promo-code">Promo code <span class="checkout-optional">(optional)</span></label>
      <input class="checkout-input" type="text" id="promo-code" name="promo-code" placeholder="Enter code" autocomplete="off">

      <div id="checkout-error" class="checkout-error" role="alert"></div>

      <button type="submit" id="submit-btn" class="btn btn-primary checkout-submit">
        <span id="submit-btn-text">Start 7-day free trial</span>
      </button>
      <div class="checkout-fine">You won't be charged until the trial ends. Cancel anytime.</div>
    </form>
  </div>
</main>

<script src="/checkout-page.js"></script>
</body>
</html>
